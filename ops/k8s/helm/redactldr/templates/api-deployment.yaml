apiVersion: apps/v1
kind: Deployment
metadata:
  name: redactldr-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redactldr-api
  template:
    metadata:
      labels:
        app: redactldr-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.image.api }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: {{ .Values.service.apiPort }}
          env:
            - name: AWS_REGION
              value: {{ .Values.env.AWS_REGION | quote }}
            - name: CELERY_BROKER_URL
              value: {{ .Values.env.CELERY_BROKER_URL | quote }}
            - name: CELERY_BACKEND_URL
              value: {{ .Values.env.CELERY_BACKEND_URL | quote }}
      volumes:
        - name: tmp
          emptyDir: {}
