version: '3.9'

services: 
  api: 
    build:
      context: ../../
      dockerfile: ops/docker/api.Dockerfile
    container_name: redacTLDR-api
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1
    ports:
      - 8000:8000
    depends_on:
      - redis
  worker:
    build:
      context: ../../
      dockerfile: ops/docker/worker.Dockerfile
    container_name: redacTLDR-worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    container_name: redacTLDR-redis
    ports:
      - 6379:6379
    