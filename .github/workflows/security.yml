name: Security

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sbom-and-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f ops/docker/api.Dockerfile -t redactldr-api:scan .

      - name: Build worker image
        run: docker build -f ops/docker/worker.Dockerfile -t redactldr-worker:scan .

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: redactldr-api:scan
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Generate SBOM worker (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: redactldr-worker:scan
          format: spdx-json
          output-file: sbom-worker.spdx.json

      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: redactldr-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL

      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: redactldr-worker:scan
          format: sarif
          output: trivy-worker.sarif
          severity: HIGH,CRITICAL

      - name: Upload API scan result
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload worker scan result
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker

  dependency-and-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-api.txt -r requirements-worker.txt
      # Shipped dependencies block the build. Build tooling is reported only.
      - name: JavaScript dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign-images:
    runs-on: ubuntu-latest
    needs: sbom-and-scan
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
      - name: Example signing step
        run: |
          echo "Replace with registry push + digest signing"
          echo "cosign sign <image>@sha256:<digest>"
