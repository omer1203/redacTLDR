name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: npm install
      - name: Lint web
        run: npm run web:lint
      - name: Typecheck web
        run: npm run web:typecheck
      - name: Build web
        run: npm run web:build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f ops/docker/api.Dockerfile -t redactldr-api:ci .
      - name: Build worker image
        run: docker build -f ops/docker/worker.Dockerfile -t redactldr-worker:ci .
